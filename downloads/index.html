<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Download BizCor ERP | Naewt Group</title>
  <meta name="description" content="Download the latest BizCor ERP desktop app (Windows) and BizCor Connect mobile app (Android).">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgb(15, 35, 70), rgb(5, 20, 45));
      color: #f0f4ff;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }
    .logo { font-size: 44px; margin-bottom: 10px; }
    h1 {
      font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFF, #b6e1fc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { color: #cfdfed; font-size: 0.95rem; margin-bottom: 6px; }
    .version-badge {
      display: inline-block; margin: 10px 0 26px; padding: 5px 16px;
      background: rgba(108,62,255,0.25); border: 1px solid rgba(108,62,255,0.5);
      color: #d7c9ff; border-radius: 30px; font-size: 0.8rem; font-weight: 600;
    }
    .btn-group { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 20px; border-radius: 20px; font-weight: 700; font-size: 1rem;
      border: none; cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      color: white;
    }
    .btn-primary { background: #6c3eff; box-shadow: 0 8px 20px rgba(108,62,255,0.35); }
    .btn-primary:hover { background: #5a2be0; transform: translateY(-3px); box-shadow: 0 15px 25px -8px rgba(108,62,255,0.55); }
    .btn-secondary { background: #1fd685; box-shadow: 0 8px 20px rgba(31,214,133,0.3); }
    .btn-secondary:hover { background: #16bc74; transform: translateY(-3px); }
    .btn small { display: block; font-weight: 400; opacity: 0.85; font-size: 0.75rem; margin-top: 2px; }
    .btn-text { text-align: left; }
    .status { margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
    .footer-link { margin-top: 26px; font-size: 0.8rem; color: #7dd3fc; text-decoration: none; }
    .footer-link:hover { text-decoration: underline; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.25);
      border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📦</div>
    <h1>BizCor ERP</h1>
    <p class="subtitle">Download the latest apps</p>
    <div class="version-badge" id="versionBadge">Loading latest version…</div>

    <div class="btn-group" id="btnGroup">
      <div class="spinner"></div>
    </div>

    <div class="status" id="statusMsg"></div>
    <a class="footer-link" href="https://github.com/nafybbk/bizcor-releases/releases" target="_blank" rel="noopener">View all releases on GitHub →</a>
  </div>

  <script>
    const API_URL = "https://api.github.com/repos/nafybbk/bizcor-releases/releases/latest";
    const versionBadge = document.getElementById("versionBadge");
    const btnGroup = document.getElementById("btnGroup");
    const statusMsg = document.getElementById("statusMsg");

    fetch(API_URL)
      .then(r => {
        if (!r.ok) throw new Error("GitHub API error " + r.status);
        return r.json();
      })
      .then(release => {
        const tag = release.tag_name || "latest";
        versionBadge.textContent = "Latest version " + tag;

        const exeAsset = (release.assets || []).find(a => a.name.toLowerCase().endsWith(".exe"));
        const apkAsset = (release.assets || []).find(a => a.name.toLowerCase().endsWith(".apk"));

        btnGroup.innerHTML = "";

        if (exeAsset) {
          const sizeMb = (exeAsset.size / (1024 * 1024)).toFixed(0);
          const a = document.createElement("a");
          a.href = exeAsset.browser_download_url;
          a.className = "btn btn-primary";
          a.setAttribute("download", "");
          a.innerHTML = "💻 <span class='btn-text'>Windows Desktop App<small>" + exeAsset.name + " • " + sizeMb + " MB</small></span>";
          btnGroup.appendChild(a);
        }

        if (apkAsset) {
          const sizeMb = (apkAsset.size / (1024 * 1024)).toFixed(0);
          const a = document.createElement("a");
          a.href = apkAsset.browser_download_url;
          a.className = "btn btn-secondary";
          a.setAttribute("download", "");
          a.innerHTML = "📱 <span class='btn-text'>Android Mobile App<small>" + apkAsset.name + " • " + sizeMb + " MB</small></span>";
          btnGroup.appendChild(a);
        }

        if (!exeAsset && !apkAsset) {
          statusMsg.textContent = "No installers found in the latest release.";
        }
      })
      .catch(err => {
        versionBadge.textContent = "Could not load version info";
        btnGroup.innerHTML = "";
        statusMsg.textContent = "Please try again shortly, or visit the GitHub releases page below.";
        console.error(err);
      });
  </script>
</body>
</html>
