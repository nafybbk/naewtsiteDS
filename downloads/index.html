<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Download BizCor ERP | Naewt Group</title>
  <meta name="description" content="Download the latest BizCor ERP desktop app (Windows) and BizCor Connect mobile app (Android).">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script src="contact-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
      background: radial-gradient(circle at 10% 20%, rgb(15, 35, 70), rgb(5, 20, 45));
      color: #f0f4ff;
      line-height: 1.5;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .langToggle {
      position: fixed; top: 16px; right: 16px; z-index: 20;
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px; padding: 4px; cursor: pointer; user-select: none;
    }
    .langToggle .glyph {
      width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.85rem; color: #94a3b8; transition: all 0.2s ease;
    }
    .langToggle .glyph.active { background: #6c3eff; color: white; }

    .page {
      max-width: 980px; margin: 0 auto;
      display: grid; grid-template-columns: 380px 1fr; gap: 20px;
      align-items: start;
      padding-top: 44px;
    }
    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 32px 26px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }

    .left { text-align: center; }
    .logo-img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 10px; }
    h1 {
      font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFF, #b6e1fc);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { color: #cfdfed; font-size: 0.92rem; margin-bottom: 4px; }
    .version-badge {
      display: inline-block; margin: 8px 0 20px; padding: 5px 16px;
      background: rgba(108,62,255,0.25); border: 1px solid rgba(108,62,255,0.5);
      color: #d7c9ff; border-radius: 30px; font-size: 0.78rem; font-weight: 600;
    }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 18px; border-radius: 18px; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer; transition: all 0.25s ease; text-decoration: none;
      color: white;
    }
    .btn-primary { background: #6c3eff; box-shadow: 0 8px 20px rgba(108,62,255,0.35); }
    .btn-primary:hover { background: #5a2be0; transform: translateY(-3px); }
    .btn-secondary { background: #1fd685; box-shadow: 0 8px 20px rgba(31,214,133,0.3); }
    .btn-secondary:hover { background: #16bc74; transform: translateY(-3px); }
    .btn-tertiary { background: #ff9f43; box-shadow: 0 8px 20px rgba(255,159,67,0.3); }
    .btn-tertiary:hover { background: #e8890f; transform: translateY(-3px); }
    .btn-cloud { background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.3); box-shadow: none; }
    .btn-cloud:hover { background: rgba(255,255,255,0.18); transform: translateY(-3px); }
    .btn-disabled { background: rgba(255,255,255,0.05); border: 1.5px dashed rgba(255,255,255,0.2); box-shadow: none; cursor: default; opacity: 0.6; }
    .btn small { display: block; font-weight: 400; opacity: 0.85; font-size: 0.72rem; margin-top: 2px; }
    .btn-text { text-align: left; }
    .status { margin-top: 16px; font-size: 0.82rem; color: #94a3b8; }
    .spinner {
      width: 22px; height: 22px; border: 3px solid rgba(255,255,255,0.25);
      border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer-link { display: block; margin-top: 18px; font-size: 0.78rem; color: #7dd3fc; text-decoration: none; }
    .footer-link:hover { text-decoration: underline; }

    .support-box {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.12);
      text-align: left;
    }
    .support-title { font-size: 0.78rem; font-weight: 700; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
    .support-link { display: block; font-size: 0.85rem; color: #e2e8f0; text-decoration: none; padding: 6px 0; }
    .support-link:hover { color: #7dd3fc; }

    .right h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      padding: 8px 18px; border-radius: 30px; font-weight: 700; font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.18); cursor: pointer; background: rgba(255,255,255,0.05); color: #cfdfed;
    }
    .tab.active.win { background: #6c3eff; border-color: #6c3eff; color: white; }
    .tab.active.apk { background: #1fd685; border-color: #1fd685; color: #06281a; }

    .steps { display: none; flex-direction: column; gap: 10px; }
    .steps.active { display: flex; }
    .step {
      display: flex; gap: 12px; align-items: flex-start;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 12px 14px;
    }
    .stepnum {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.8rem; color: white; background: #6c3eff;
    }
    .apk .stepnum { background: #1fd685; color: #06281a; }
    .step p { font-size: 0.85rem; color: #e2e8f0; }
    .step p b { color: #fff; }

    .guide-link {
      display: inline-block; margin-top: 16px; font-size: 0.82rem; color: #7dd3fc; text-decoration: none;
    }
    .guide-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="langToggle" id="langToggle" role="button" aria-label="Toggle Hindi / English" title="भाषा बदलें / Switch language">
    <span class="glyph" id="glyphHi">अ</span>
    <span class="glyph" id="glyphEn">A</span>
  </div>

  <div class="page">
    <div class="card left">
      <img class="logo-img" src="bizcor-logo.png" alt="BizCor">
      <h1 id="t-title">BizCor ERP</h1>
      <p class="subtitle" id="t-subtitle">नए ऐप डाउनलोड करें</p>
      <div class="btn-group" id="btnGroup">
        <div class="spinner"></div>
      </div>

      <div class="status" id="statusMsg"></div>
      <a class="footer-link" href="https://github.com/nafybbk/bizcor-releases/releases" target="_blank" rel="noopener" id="t-allReleases">GitHub पर सभी रिलीज़ देखें →</a>

      <div class="support-box" id="supportBox">
        <div class="support-title" id="t-supportTitle">मदद चाहिए?</div>
      </div>
    </div>

    <div class="card right">
      <h2 id="t-howTitle">इंस्टॉल कैसे करें</h2>
      <div class="tabs">
        <div class="tab active win" id="tabWinBtn" onclick="showTab('win')">विंडोज़</div>
        <div class="tab apk" id="tabApkBtn" onclick="showTab('apk')">एंड्रॉइड</div>
      </div>

      <div class="steps win active" id="stepsWin"></div>
      <div class="steps apk" id="stepsApk"></div>

      <a class="guide-link" href="guide/" id="t-fullGuide">📘 पूरी illustrated guide देखें (PDF भी) →</a>
    </div>
  </div>

  <script>
    const CONTENT = {
      en: {
        title: "BizCor ERP",
        subtitle: "Download the latest apps",
        allReleases: "View all releases on GitHub →",
        howTitle: "How to Install",
        tabWin: "Windows",
        tabApk: "Android",
        fullGuide: "📘 See the full illustrated guide (PDF too) →",
        winName: "BizCor ERP — Desktop App",
        apkName: "BizCor Connect — Mobile App",
        krName: "Karigar Slip Register — Desktop App",
        krSoon: "Coming soon",
        cloudName: "BizCor ERP Cloud",
        cloudSub: "Open in browser — no install needed",
        supportTitle: "Need help?",
        winSteps: [
          "Click the <b>\"Windows Desktop App\"</b> button above to download it.",
          "If Windows shows a warning, click <b>\"More info\"</b> then <b>\"Run anyway\"</b>.",
          "Follow the installer: <b>Next → Install → Finish</b>.",
          "Open the app and log in.",
        ],
        apkSteps: [
          "On your phone, tap the <b>\"Android Mobile App\"</b> button above.",
          "Allow <b>\"Install unknown apps\"</b> when asked.",
          "Tap <b>\"Install\"</b>, then <b>\"Open\"</b>.",
          "Log in with your mobile number and PIN.",
        ],
      },
      hi: {
        title: "बिज़कोर ईआरपी",
        subtitle: "नए ऐप डाउनलोड करें",
        allReleases: "GitHub पर सभी रिलीज़ देखें →",
        howTitle: "इंस्टॉल कैसे करें",
        tabWin: "विंडोज़",
        tabApk: "एंड्रॉइड",
        fullGuide: "📘 पूरी illustrated guide देखें (PDF भी) →",
        winName: "बिज़कोर ईआरपी — डेस्कटॉप ऐप",
        apkName: "बिज़कोर कनेक्ट — मोबाइल ऐप",
        krName: "करीगर स्लिप रजिस्टर — डेस्कटॉप ऐप",
        krSoon: "जल्द आ रहा है",
        cloudName: "बिज़कोर ईआरपी क्लाउड",
        cloudSub: "ब्राउज़र में खोलें — इंस्टॉल की ज़रूरत नहीं",
        supportTitle: "मदद चाहिए?",
        winSteps: [
          "ऊपर <b>\"विंडोज़ डेस्कटॉप ऐप\"</b> बटन दबाकर डाउनलोड करें।",
          "अगर विंडोज़ चेतावनी दिखाए, तो <b>\"More info\"</b> फिर <b>\"Run anyway\"</b> दबाएं।",
          "इंस्टॉलर को फॉलो करें: <b>Next → Install → Finish</b>।",
          "ऐप खोलें और लॉगिन करें।",
        ],
        apkSteps: [
          "अपने फ़ोन में ऊपर <b>\"एंड्रॉइड मोबाइल ऐप\"</b> बटन दबाएं।",
          "पूछे जाने पर <b>\"Install unknown apps\"</b> की इजाज़त दें।",
          "<b>\"Install\"</b> दबाएं, फिर <b>\"Open\"</b> दबाएं।",
          "अपना मोबाइल नंबर और पिन डालकर लॉगिन करें।",
        ],
      },
    };

    let lang = "hi";

    function renderSteps(id, steps, cls) {
      const el = document.getElementById(id);
      el.innerHTML = steps.map((s, i) =>
        '<div class="step ' + cls + '"><div class="stepnum">' + (i + 1) + '</div><p>' + s + '</p></div>'
      ).join("");
    }

    function applyLang() {
      const c = CONTENT[lang];
      document.documentElement.lang = lang;
      document.getElementById("t-title").textContent = c.title;
      document.getElementById("t-subtitle").textContent = c.subtitle;
      document.getElementById("t-allReleases").textContent = c.allReleases;
      document.getElementById("t-howTitle").textContent = c.howTitle;
      document.getElementById("t-fullGuide").textContent = c.fullGuide;
      document.getElementById("t-supportTitle").textContent = c.supportTitle;
      document.getElementById("tabWinBtn").textContent = c.tabWin;
      document.getElementById("tabApkBtn").textContent = c.tabApk;
      renderSteps("stepsWin", c.winSteps, "win");
      renderSteps("stepsApk", c.apkSteps, "apk");
      document.getElementById("glyphHi").classList.toggle("active", lang === "hi");
      document.getElementById("glyphEn").classList.toggle("active", lang === "en");
      renderButtons();
    }

    document.getElementById("langToggle").addEventListener("click", () => {
      lang = lang === "hi" ? "en" : "hi";
      applyLang();
    });

    function showTab(name) {
      document.getElementById('stepsWin').classList.toggle('active', name === 'win');
      document.getElementById('stepsApk').classList.toggle('active', name === 'apk');
      document.getElementById('tabWinBtn').classList.toggle('active', name === 'win');
      document.getElementById('tabApkBtn').classList.toggle('active', name === 'apk');
    }

    // Each product versions independently (KR releases on its own schedule,
    // separate from BizCor ERP+Connect) — so instead of trusting GitHub's
    // single "latest release" (which only reflects whichever product was
    // tagged most recently), we scan a page of releases and, per product,
    // take the newest one that actually has a matching asset.
    const RELEASES_URL = "https://api.github.com/repos/nafybbk/bizcor-releases/releases?per_page=30";
    const CLOUD_URL = "https://erp.naewtgroup.com";
    const btnGroup = document.getElementById("btnGroup");
    const statusMsg = document.getElementById("statusMsg");
    let releases = null;

    function findLatestAsset(matchFn) {
      if (!releases) return null;
      for (const rel of releases) {
        const asset = (rel.assets || []).find(a => matchFn(a.name.toLowerCase()));
        if (asset) return { release: rel, asset };
      }
      return null;
    }

    function makeDownloadBtn(cls, icon, name, found) {
      const a = document.createElement("a");
      if (found) {
        const sizeMb = (found.asset.size / (1024 * 1024)).toFixed(0);
        a.href = found.asset.browser_download_url;
        a.className = "btn " + cls;
        a.setAttribute("download", "");
        a.innerHTML = icon + " <span class='btn-text'>" + name + "<small>" + (found.release.tag_name || "") + " • " + found.asset.name + " • " + sizeMb + " MB</small></span>";
      } else {
        a.className = "btn btn-disabled";
        a.innerHTML = icon + " <span class='btn-text'>" + name + "<small>" + CONTENT[lang].krSoon + "</small></span>";
      }
      return a;
    }

    function renderButtons() {
      if (!releases) return; // still loading — keep the spinner up
      const c = CONTENT[lang];
      btnGroup.innerHTML = "";

      const exeFound = findLatestAsset(n => n.endsWith(".exe") && n.includes("bizcor-erp"));
      const apkFound = findLatestAsset(n => n.endsWith(".apk"));
      const krFound = findLatestAsset(n => n.endsWith(".exe") && (n.includes("karigar") || n.includes("slip")));

      btnGroup.appendChild(makeDownloadBtn("btn-primary", "💻", c.winName, exeFound));
      btnGroup.appendChild(makeDownloadBtn("btn-secondary", "📱", c.apkName, apkFound));
      btnGroup.appendChild(makeDownloadBtn("btn-tertiary", "🧵", c.krName, krFound));

      const cloudBtn = document.createElement("a");
      cloudBtn.href = CLOUD_URL;
      cloudBtn.target = "_blank";
      cloudBtn.rel = "noopener";
      cloudBtn.className = "btn btn-cloud";
      cloudBtn.innerHTML = "☁️ <span class='btn-text'>" + c.cloudName + "<small>" + c.cloudSub + "</small></span>";
      btnGroup.appendChild(cloudBtn);

      statusMsg.textContent = (!exeFound && !apkFound) ? (lang === "hi" ? "रिलीज़ जानकारी लोड नहीं हुई।" : "Could not load release info.") : "";
    }

    function renderSupportBox() {
      const contact = window.SUPPORT_CONTACT || {};
      const box = document.getElementById("supportBox");
      // Keep only the title (already rendered by applyLang) — append links after it
      box.querySelectorAll(".support-link").forEach(el => el.remove());
      if (contact.whatsapp) {
        const a = document.createElement("a");
        a.className = "support-link";
        a.href = "https://wa.me/" + contact.whatsapp;
        a.target = "_blank"; a.rel = "noopener";
        a.textContent = "💬 WhatsApp";
        box.appendChild(a);
      }
      if (contact.email1) {
        const a = document.createElement("a");
        a.className = "support-link";
        a.href = "mailto:" + contact.email1;
        a.textContent = "✉️ " + contact.email1;
        box.appendChild(a);
      }
      if (contact.email2) {
        const a = document.createElement("a");
        a.className = "support-link";
        a.href = "mailto:" + contact.email2;
        a.textContent = "✉️ " + contact.email2;
        box.appendChild(a);
      }
    }
    renderSupportBox();

    applyLang();

    fetch(RELEASES_URL)
      .then(r => { if (!r.ok) throw new Error("GitHub API error " + r.status); return r.json(); })
      .then(list => { releases = Array.isArray(list) ? list : []; renderButtons(); })
      .catch(err => {
        btnGroup.innerHTML = "";
        statusMsg.textContent = lang === "hi" ? "थोड़ी देर में फिर कोशिश करें, या नीचे GitHub releases page देखें।" : "Please try again shortly, or visit the GitHub releases page below.";
        console.error(err);
      });
  </script>
</body>
</html>
