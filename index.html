<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naewt Group</title>

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1b2b;
  color:white;
}

/* HERO */
.hero{
  text-align:center;
  padding:80px 20px;
  background:linear-gradient(135deg,#4a00e0,#8e2de2);
}
.hero h1{font-size:40px;}
.hero p{font-size:18px;}

.btn{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  margin:10px;
  cursor:pointer;
  font-size:16px;
}
.btn1{background:#7c3aed;color:white;}
.btn2{background:#22c55e;color:white;}

/* TRUST SECTION */
.trust{
  background:#d9e3df;
  color:black;
  text-align:center;
  padding:50px 20px;
}

/* LOGO */
.logo{
  width:120px;
  height:120px;
  background:#22c55e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  margin:auto;
  animation:float 3s infinite;
}
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

/* IMPACT */
.section{
  padding:40px 20px;
  text-align:center;
}
.card{
  background:rgba(255,255,255,0.1);
  padding:20px;
  margin:10px auto;
  border-radius:15px;
  max-width:320px;
  backdrop-filter:blur(10px);
}

/* DIRECTORY */
select{
  padding:10px;
  border-radius:8px;
}

/* LIST CARD */
.listCard{
  background:white;
  color:black;
  padding:15px;
  margin:10px auto;
  border-radius:12px;
  max-width:350px;
  cursor:pointer;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}
.popupBox{
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
.close{
  float:right;
  color:red;
  cursor:pointer;
}
input{
  padding:10px;
  width:70%;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero" data-aos="fade-up">
  <h1>Naewt Group</h1>
  <p>Empowering Skilled & Unskilled People</p>

  <button class="btn btn1">Open FabricPro</button>
  <button class="btn btn2">Explore Trust</button>
</div>

<!-- TRUST -->
<div class="trust" data-aos="fade-up">
  <h2>Naewt Trust</h2>

  <div class="logo">🤝</div>

  <h3>Every Smile Matters</h3>
  <p>Education • Healthcare • Welfare</p>
</div>

<!-- IMPACT -->
<div class="section">
  <h2 data-aos="fade-up">Our Impact</h2>

  <div class="card" data-aos="zoom-in">👷 Workers<br><b>1200+</b></div>
  <div class="card" data-aos="zoom-in">💰 Earnings<br><b>₹25L+</b></div>
  <div class="card" data-aos="zoom-in">🤝 Helped<br><b>300+</b></div>
</div>

<!-- DIRECTORY -->
<div class="section">
  <h2 data-aos="fade-up">Directory</h2>

  <select id="cat" onchange="loadData()">
    <option value="">Select</option>
    <option value="doctor">Doctors</option>
    <option value="lab">Labs</option>
    <option value="pharmacy">Pharmacy</option>
  </select>

  <div id="list"></div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popupBox">
<span class="close" onclick="closePop()">X</span>

<h3 id="name"></h3>
<p id="info"></p>
<p id="rating"></p>

<div id="reviews"></div>

<input id="rev">
<button onclick="addRev()">Submit</button>

</div>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>AOS.init();</script>

<script>

let index=0;

const data=[
{name:"Dr Sharma",type:"doctor",info:"Heart Specialist",rating:4.5,reviews:["Good"]},
{name:"City Lab",type:"lab",info:"Blood Test",rating:4.2,reviews:["Fast"]},
{name:"Med Pharmacy",type:"pharmacy",info:"All medicines",rating:4.3,reviews:["Cheap"]}
];

function loadData(){
let c=document.getElementById("cat").value;
let html="";

data.forEach((d,i)=>{
if(d.type==c){
html+=`
<div class="listCard" onclick="openPop(${i})">
<b>${d.name}</b><br>
${d.info}<br>
⭐ ${d.rating}
</div>`;
}
});

document.getElementById("list").innerHTML=html;
}

function openPop(i){
index=i;
let d=data[i];

document.getElementById("popup").style.display="flex";
document.getElementById("name").innerText=d.name;
document.getElementById("info").innerText=d.info;
document.getElementById("rating").innerText="⭐ "+d.rating;

let rev="";
d.reviews.forEach(r=>rev+=`<p>${r}</p>`);
document.getElementById("reviews").innerHTML=rev;
}

function closePop(){
document.getElementById("popup").style.display="none";
}

function addRev(){
let t=document.getElementById("rev").value;
if(t){
data[index].reviews.push(t);
document.getElementById("rev").value="";
openPop(index);
}
}

</script>

</body>
</html>
