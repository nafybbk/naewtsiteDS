<!DOCTYPE html>
<html>
<head>
<title>Naewt Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  text-align:center;
}

.hero{
  padding:60px 20px;
}

.btn{
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  color:white;
  font-size:16px;
}
.btn1{background:#7b2ff7;}
.btn2{background:#2ecc71;}

.section{
  padding:40px 20px;
}

.card{
  background:white;
  color:black;
  padding:15px;
  margin:10px auto;
  border-radius:12px;
  width:90%;
  max-width:400px;
}

input,select{
  padding:10px;
  margin:5px;
  border-radius:6px;
  border:none;
}

.footer{
  background:black;
  padding:20px;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:white;
  color:black;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}
</style>

</head>

<body>

<div class="hero">
  <h1>Naewt Group</h1>
  <p>Empowering Skilled & Unskilled People with FabricPro</p>

  <a href="https://fab.naewtgroup.com"><button class="btn btn1">Open FabricPro</button></a>
  <a href="https://trust.naewtgroup.com"><button class="btn btn2">Explore Trust</button></a>
</div>

<div class="section">
  <h2>Healthcare Directory</h2>

  <input type="text" id="search" placeholder="Search doctor, lab...">
  <select id="filter">
    <option value="all">All</option>
    <option value="doctor">Doctors</option>
    <option value="lab">Labs</option>
  </select>

  <div id="list"></div>
</div>

<div class="section">
  <h2>Our Impact</h2>

  <div class="card">👷 Workers <br><b>1200+</b></div>
  <div class="card">💰 Earnings <br><b>₹25L+</b></div>
  <div class="card">🤝 Helped <br><b>300+</b></div>
</div>

<div class="footer">
  © Naewt Group
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h3 id="pname"></h3>
    <p id="pspec"></p>
    <p id="prating"></p>

    <div id="reviews"></div>

    <input type="text" id="reviewInput" placeholder="Write review...">
    <button onclick="addReview()">Submit</button>

    <br><br>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>

const data = [
  {name:"Dr Khan", type:"doctor", spec:"Cardiologist ❤️", rating:4.6, reviews:["Good doctor"]},
  {name:"City Lab", type:"lab", spec:"Blood Test & Checkup", rating:4.3, reviews:["Fast service"]},
  {name:"Dr Sharma", type:"doctor", spec:"Dentist 🦷", rating:4.8, reviews:["Very friendly"]}
];

let currentIndex = 0;

function show(){
  let html="";
  let search=document.getElementById("search").value.toLowerCase();
  let filter=document.getElementById("filter").value;

  data.forEach((item,i)=>{
    if((filter==="all" || item.type===filter) &&
       item.name.toLowerCase().includes(search)){

      html += `
      <div class="card" onclick="openPopup(${i})">
        <b>${item.name}</b><br>
        ${item.spec}<br>
        ⭐ ${item.rating}
      </div>
      `;
    }
  });

  document.getElementById("list").innerHTML = html;
}

function openPopup(i){
  currentIndex = i;
  let item = data[i];

  document.getElementById("popup").style.display="flex";
  document.getElementById("pname").innerText=item.name;
  document.getElementById("pspec").innerText=item.spec;
  document.getElementById("prating").innerText="⭐ "+item.rating;

  let revHTML="";
  item.reviews.forEach(r=>{
    revHTML += `<p>• ${r}</p>`;
  });

  document.getElementById("reviews").innerHTML=revHTML;
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

function addReview(){
  let text = document.getElementById("reviewInput").value;

  if(text){
    data[currentIndex].reviews.push(text);
    document.getElementById("reviewInput").value="";
    openPopup(currentIndex);
  }
}

document.getElementById("search").onkeyup = show;
document.getElementById("filter").onchange = show;

show();

</script>

</body>
</html>
