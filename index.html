<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naewt Group</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1b2b;
  color:white;
}

/* NAVBAR */
.nav{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#071422;
  position:sticky;
  top:0;
}
.nav a{
  color:white;
  margin:0 10px;
  text-decoration:none;
}

/* HERO */
.hero{
  padding:40px 20px;
  text-align:center;
  background:linear-gradient(135deg,#4a00e0,#8e2de2);
}
.btn{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  margin:10px;
  cursor:pointer;
}
.btn1{background:#7c3aed;color:white;}
.btn2{background:#22c55e;color:white;}

/* SECTION */
.section{
  padding:30px 20px;
  text-align:center;
}

/* CARDS */
.card{
  background:white;
  color:black;
  padding:15px;
  margin:10px auto;
  border-radius:12px;
  max-width:350px;
  cursor:pointer;
}

/* IMPACT */
.impact .card{
  background:#eee;
}

/* SELECT */
select{
  padding:10px;
  border-radius:8px;
  margin:10px;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}
.popup-content{
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:400px;
}
.close{
  float:right;
  color:red;
  cursor:pointer;
  font-size:20px;
}

input{
  padding:10px;
  width:70%;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
  <div><b>Naewt Trust</b></div>
  <div>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Our Work</a>
    <a href="#">Contact</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Naewt Group</h1>
  <p>Empowering Skilled & Unskilled People</p>

  <button class="btn btn1">Open FabricPro</button>
  <button class="btn btn2">Explore Trust</button>
</div>

<!-- IMPACT -->
<div class="section impact">
  <h2>Our Impact</h2>

  <div class="card">👷 Workers <br><b>1200+</b></div>
  <div class="card">💰 Earnings <br><b>₹25L+</b></div>
  <div class="card">🤝 Helped <br><b>300+</b></div>
</div>

<!-- DIRECTORY -->
<div class="section">
  <h2>Empanelled Directory</h2>

  <!-- CATEGORY -->
  <select id="category" onchange="loadList()">
    <option value="">Select Category</option>
    <option value="doctor">Doctors</option>
    <option value="lab">Labs</option>
    <option value="pharmacy">Pharmacy</option>
    <option value="advocate">Advocate</option>
    <option value="ca">Chartered Accountant</option>
    <option value="teacher">Teacher</option>
    <option value="school">School</option>
    <option value="madarsa">Madarsa</option>
  </select>

  <!-- NAME LIST -->
  <div id="list"></div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">X</span>

    <h3 id="pname"></h3>
    <p id="pinfo"></p>
    <p id="prating"></p>

    <h4>Reviews</h4>
    <div id="reviews"></div>

    <input id="reviewInput" placeholder="Write review...">
    <button onclick="addReview()">Submit</button>

  </div>
</div>

<script>

let currentIndex=0;

/* DATA */
const data=[
{name:"Dr. Sharma",type:"doctor",info:"Cardiologist",rating:4.5,reviews:["Good doctor","Helpful"]},
{name:"City Lab",type:"lab",info:"Blood Test",rating:4.2,reviews:["Fast service"]},
{name:"Health Pharmacy",type:"pharmacy",info:"All medicines",rating:4.3,reviews:["Affordable"]},
{name:"Advocate Khan",type:"advocate",info:"Legal expert",rating:4.1,reviews:["Experienced"]},
{name:"CA Gupta",type:"ca",info:"Tax consultant",rating:4.4,reviews:["Professional"]},
{name:"Mr. Verma",type:"teacher",info:"Math teacher",rating:4.6,reviews:["Great teaching"]},
{name:"Bright School",type:"school",info:"CBSE School",rating:4.3,reviews:["Good education"]},
{name:"Madarsa Noor",type:"madarsa",info:"Islamic education",rating:4.5,reviews:["Peaceful place"]}
];

/* LOAD LIST */
function loadList(){
let cat=document.getElementById("category").value;
let html="";

data.forEach((item,i)=>{
if(item.type==cat){
html+=`
<div class="card" onclick="openPopup(${i})">
<b>${item.name}</b><br>
${item.info}<br>
⭐ ${item.rating}
</div>`;
}
});

document.getElementById("list").innerHTML=html;
}

/* POPUP */
function openPopup(i){
currentIndex=i;
let item=data[i];

document.getElementById("popup").style.display="flex";
document.getElementById("pname").innerText=item.name;
document.getElementById("pinfo").innerText=item.info;
document.getElementById("prating").innerText="⭐ "+item.rating;

let revHTML="";
item.reviews.forEach(r=>{
revHTML+=`<p>• ${r}</p>`;
});
document.getElementById("reviews").innerHTML=revHTML;
}

/* CLOSE */
function closePopup(){
document.getElementById("popup").style.display="none";
}

/* ADD REVIEW */
function addReview(){
let text=document.getElementById("reviewInput").value;
if(text){
data[currentIndex].reviews.push(text);
document.getElementById("reviewInput").value="";
openPopup(currentIndex);
}
}

</script>

</body>
</html>
